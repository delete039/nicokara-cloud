[project]
name = "nicokara-backend"
version = "0.3.0a3"
description = "Local-first API for ニコカラ自动生成器"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "Janome>=0.5,<0.6",
  "Pillow>=11,<12",
  "pydantic-settings>=2.10,<3",
  "pykakasi>=2.3,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
ai = [
  "audio-separator[cpu]>=0.44.5,<0.45",
  "faster-whisper>=1.2,<2",
  "librosa>=0.11,<0.12",
  "scipy>=1.14,<2",
  "torchaudio>=2.7.1,<2.8",
]
dev = [
  "httpx2>=2,<3",
  "pytest>=8.4,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["data*", "tests*"]
