services:
  backend:
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    build:
      context: ./backend
    environment:
      NICOKARA_DATA_DIR: /app/backend/data
      NICOKARA_STORAGE_DIR: /app/storage/jobs
      NICOKARA_ALLOWED_ORIGINS: http://localhost:3000
      NICOKARA_PROCESSING_ENABLED: "true"
      NICOKARA_MAX_PENDING_JOBS: ${NICOKARA_MAX_PENDING_JOBS:-4}
      NICOKARA_MAX_UPLOADS_PER_HOUR: ${NICOKARA_MAX_UPLOADS_PER_HOUR:-6}
      NICOKARA_MAX_ACTIVE_JOBS_PER_CLIENT: ${NICOKARA_MAX_ACTIVE_JOBS_PER_CLIENT:-2}
      NICOKARA_CLEANUP_ENABLED: ${NICOKARA_CLEANUP_ENABLED:-true}
      NICOKARA_JOB_RETENTION_HOURS: ${NICOKARA_JOB_RETENTION_HOURS:-24}
      NICOKARA_CLEANUP_INTERVAL_SECONDS: ${NICOKARA_CLEANUP_INTERVAL_SECONDS:-3600}
      NICOKARA_FFMPEG_PATH: ffmpeg
      NICOKARA_VIDEO_RENDER_TIMEOUT_SECONDS: ${NICOKARA_VIDEO_RENDER_TIMEOUT_SECONDS:-7200}
      NICOKARA_VIDEO_RENDER_PRESET: ${NICOKARA_VIDEO_RENDER_PRESET:-veryfast}
      NICOKARA_VIDEO_RENDER_CRF: ${NICOKARA_VIDEO_RENDER_CRF:-20}
      NICOKARA_WHISPER_MODEL: small
      NICOKARA_WHISPER_DEVICE: cpu
      NICOKARA_WHISPER_COMPUTE_TYPE: int8
      NICOKARA_VOCAL_REMOVAL_BACKEND: mdx
      NICOKARA_VOCAL_REMOVAL_MODEL: UVR_MDXNET_KARA_2.onnx
      NICOKARA_VOCAL_REMOVAL_MODEL_DIR: /app/models/audio-separator
      NICOKARA_DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      NICOKARA_DEEPSEEK_BASE_URL: https://api.deepseek.com
      NICOKARA_DEEPSEEK_MODEL: deepseek-v4-flash
    volumes:
      - backend-data:/app/backend/data
      - ./storage:/app/storage
      - whisper-cache:/root/.cache/huggingface
      - mdx-model-cache:/app/models/audio-separator
    ports:
      - "8000:8000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  backend-data:
  whisper-cache:
  mdx-model-cache:
